# Stable publication is tag-only. PR/preview/nightly candidates use checks.yml without signing secrets.
name: Stable release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  apk:
    if: github.repository == 'kvnloo/detent'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      KEYSTORE_BASE64: ${{ secrets.DETENT_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a main-contained tag and stable signing key
        run: |
          git merge-base --is-ancestor HEAD origin/main
          test -n "$KEYSTORE_BASE64" || { echo 'Stable release signing has not been provisioned'; exit 1; }

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Set the version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=0.0.0-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi

      # Only a main-contained version tag can reach this trusted publication job.
      - name: Decode the signing key
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "DETENT_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build the APK
        env:
          DETENT_KEYSTORE_PASSWORD: ${{ secrets.DETENT_KEYSTORE_PASSWORD }}
          DETENT_KEY_ALIAS: ${{ secrets.DETENT_KEY_ALIAS }}
          DETENT_KEY_PASSWORD: ${{ secrets.DETENT_KEY_PASSWORD }}
        run: |
          ./gradlew :app:testReleaseUnitTest :app:assembleRelease -PdetentVersion="$VERSION" -PdetentCode="$GITHUB_RUN_NUMBER" -PdetentCommit="$GITHUB_SHA" -PdetentChannel=stable -PdetentRun="$GITHUB_RUN_ID"
          cp app/build/outputs/apk/release/app-release.apk detent.apk

      - uses: actions/upload-artifact@v4
        with:
          name: detent-${{ env.VERSION }}
          path: detent.apk

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" detent.apk docs/media/detent-promo.mp4 \
            --title "Detent $VERSION" --generate-notes --verify-tag
